name: Zoho Sync Retry

# Re-drives queued Zoho CRM sync jobs (pending, or failed and past their backoff window)
# by calling the existing /api/cron/zoho-sync-retry endpoint on a schedule. Same
# CRON_SECRET pattern as any other protected cron route in this project — the secret
# lives only in the repo's encrypted Actions secrets, never in this file.
#
# Frequency: every 15 minutes. The retry backoff schedule (see src/lib/zoho/queue.server.ts)
# starts at 2 minutes, so this doesn't catch a failure the instant it's next eligible, but it
# keeps the sweep frequent enough to clear the queue promptly without excessive Actions usage
# or API calls to Zoho — a reasonable default for a background reconciliation job, not a
# time-critical one.
#
# NOTE: this workflow only takes effect once committed to the default branch, and requires
# a repository secret named CRON_SECRET (Settings -> Secrets and variables -> Actions) with
# the same value as the CRON_SECRET environment variable configured on the live App Service.
# It will 404 until the Zoho integration code itself is deployed to production.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Call Zoho sync retry endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf --max-time 30 \
            -X POST "https://dsetconsulting.com/api/cron/zoho-sync-retry" \
            -H "x-cron-secret: ${CRON_SECRET}"
